name: pages

# Publishes the web version (tools/build-web.js) to GitHub Pages. It runs on
# the same version tags as the desktop release, so both always match. Run it
# by hand (workflow_dispatch) to publish the current branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      # The sample burst lives in the sample-photos release, not in git.
      - name: Sample photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download sample-photos -p '*.JPG' -D samples -R "$GITHUB_REPOSITORY"
      - run: node tools/build-web.js _site --samples samples
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
